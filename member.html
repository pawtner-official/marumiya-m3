<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>改善の記録（メンバー用）｜丸海屋 南三条店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f5f0;--paper-2:#fffdf9;
  --ink:#1f2328;--ink-2:#4a5158;--ink-3:#8a8f95;
  --navy:#1b3b58;--vermil:#b93f2b;--amber:#a8792a;--sage:#4f7a63;
  --rule:#e2dbcf;--rule-2:#eee8dc;
  --gothic:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  --mincho:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:15px;line-height:1.85;font-feature-settings:"palt" 1;
  padding:0 clamp(16px,4vw,28px) 80px;
}
.wrap{max-width:860px;margin:0 auto}

header{padding:clamp(28px,5vw,46px) 0 0}
.tag{
  display:inline-block;font-size:11px;letter-spacing:.16em;color:#fff;
  background:var(--navy);border-radius:2px;padding:4px 11px;
}
h1{
  font-family:var(--mincho);font-weight:600;font-size:clamp(27px,5.6vw,40px);
  line-height:1.25;letter-spacing:.05em;color:var(--navy);margin-top:12px;
}
.sub{margin-top:9px;font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.hr{height:2px;background:var(--navy);margin-top:20px}

/* 録音のコツ */
.guide{
  margin-top:26px;background:#1b3b58;color:#eae4d8;border-radius:4px;
  padding:24px clamp(18px,4vw,26px);
}
.guide h2{
  font-family:var(--mincho);font-size:20px;letter-spacing:.06em;color:#fff;font-weight:600;
}
.guide .intro{margin-top:10px;font-size:13.5px;line-height:1.8;color:#c3cedb}
.guide ol{list-style:none;counter-reset:g;margin-top:16px}
.guide ol li{
  counter-increment:g;position:relative;padding:8px 0 8px 38px;font-size:16px;font-weight:500;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.guide ol li:last-child{border-bottom:none}
.guide ol li::before{
  content:counter(g);position:absolute;left:0;top:10px;width:24px;height:24px;
  background:#e7dcc6;color:#1b3b58;border-radius:50%;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.guide .note{
  margin-top:15px;font-size:13.5px;line-height:1.8;color:#e7dcc6;
  padding-left:13px;border-left:2px solid #a8792a;
}
.guide .ex{
  margin-top:16px;background:rgba(0,0,0,.22);border-radius:3px;padding:14px 16px;
  font-size:13.5px;line-height:1.85;color:#d6cfc2;
}
.guide .ex b{display:block;font-size:10.5px;letter-spacing:.14em;color:#a8a49b;margin-bottom:6px;font-weight:700}
.copy{
  margin-top:16px;background:#e7dcc6;color:#1b3b58;border:none;font-family:inherit;
  font-size:13px;font-weight:700;padding:11px 20px;border-radius:3px;cursor:pointer;transition:.16s;
}
.copy:hover{background:#fff}
.copy.done{background:var(--sage);color:#fff}

/* 回 */
.round{margin-top:34px;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px}
.round-h{
  padding:20px clamp(18px,4vw,24px);border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.round-h .n{font-family:var(--mincho);font-size:26px;color:var(--navy);letter-spacing:.04em}
.round-h .d{font-size:13.5px;color:var(--ink-2)}
.round-h .rep{font-size:12px;color:var(--ink-3);margin-left:auto}
.round-b{padding:6px clamp(18px,4vw,24px) 26px}

section{padding-top:26px}
h3{
  font-size:11.5px;letter-spacing:.18em;font-weight:700;
  padding-bottom:9px;border-bottom:1px solid var(--rule-2);margin-bottom:4px;
}
h3.ok{color:var(--sage)}
h3.adj{color:var(--vermil)}
h3.todo{color:var(--amber)}
h3.hand{color:var(--navy)}
h3.cand{color:var(--ink-3)}
h3.wip{color:var(--navy)}

.rnote{
  margin-top:18px;padding:13px 16px;background:#f3eee2;border-left:3px solid var(--amber);
  border-radius:2px;font-size:13.5px;line-height:1.8;color:var(--ink-2);
}
.draft{padding:14px 0;border-bottom:1px solid var(--rule-2)}
.draft:last-child{border-bottom:none}
.draft .t{font-size:16px;font-weight:500}
.draft ol{list-style:none;counter-reset:d;margin-top:10px}
.draft ol li{
  counter-increment:d;position:relative;padding:6px 0 6px 32px;font-size:14px;line-height:1.7;
  color:var(--ink-2);
}
.draft ol li::before{
  content:counter(d);position:absolute;left:0;top:8px;width:21px;height:21px;
  border:1.5px solid var(--ink-3);color:var(--ink-3);border-radius:50%;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.badge.wipb{background:#e6ecf2;color:var(--navy)}

.item{padding:14px 0;border-bottom:1px solid var(--rule-2)}
.item:last-child{border-bottom:none}
.item .t{font-size:16px;font-weight:500;line-height:1.6}
.item .d{margin-top:5px;font-size:14px;line-height:1.8;color:var(--ink-2)}
.item .next{
  margin-top:9px;font-size:13.5px;line-height:1.75;color:var(--vermil);
  padding-left:12px;border-left:2px solid var(--vermil);
}
.badge{
  display:inline-block;font-size:10.5px;letter-spacing:.1em;padding:2px 8px;
  border-radius:2px;margin-left:9px;vertical-align:2px;font-weight:700;
}
.badge.ng{background:#f6e3de;color:var(--vermil)}

.plain{list-style:none;padding-top:6px}
.plain li{
  font-size:14.5px;line-height:1.8;padding:7px 0 7px 18px;position:relative;
  border-bottom:1px solid var(--rule-2);
}
.plain li:last-child{border-bottom:none}
.plain li::before{content:'—';position:absolute;left:0;color:var(--ink-3)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.chips span{font-size:14px;background:#f0eade;border:1px solid var(--rule);border-radius:3px;padding:5px 12px}

.pics{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:14px}
@media(max-width:560px){.pics{grid-template-columns:1fr}}
.pic img{
  width:100%;display:block;cursor:zoom-in;
  height:auto;max-height:380px;object-fit:contain;
  border:1px solid var(--rule);border-radius:3px;background:#f0eade;
}
.zoom{
  position:fixed;inset:0;z-index:100;background:rgba(28,24,18,.92);
  display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;
}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.zoom .hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:#cdc4b4;letter-spacing:.08em}
.pic .cap{margin-top:7px;font-size:12.5px;color:var(--ink-3);line-height:1.7}

.src{padding-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.9}
.src code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:#f0eade;padding:2px 6px;border-radius:2px;word-break:break-all;
}

footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);line-height:1.9}
.err{margin-top:30px;padding:22px;background:#fff;border:1px solid var(--vermil);border-radius:3px;font-size:14px;line-height:1.9}
</style>

<body>
<div class="wrap">

  <header>
    <span class="tag">メンバー用・スタッフには共有しない</span>
    <h1>改善の記録</h1>
    <div class="sub" id="sub">読み込み中…</div>
    <div class="hr"></div>
  </header>

  <div id="guide"></div>
  <div id="rounds"></div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)};
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(d){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||''));
    return m ? m[1]+'年'+ +m[2] +'月'+ +m[3] +'日' : (d||'');
  }
  function block(cls,label,html){
    return html ? '<section><h3 class="'+cls+'">'+label+'</h3>'+html+'</section>' : '';
  }

  function guideText(g){
    return '【改善報告の録音でお願いしたいこと】\n\n'
      + g.intro + '\n\n'
      + g.items.map(function(x,i){return (i+1)+'. '+x}).join('\n') + '\n\n'
      + '※ ' + g.note + '\n\n'
      + '（言い方の例）\n' + g.example;
  }

  function render(D){
    $('#sub').textContent=D.meta.store+'　最終更新 '+fmt(D.meta.updated_at);

    /* 録音のコツ */
    var g=D.recording_guide;
    if(g){
      $('#guide').innerHTML='<div class="guide">'
        +'<h2>録音でお願いしたい3つ</h2>'
        +'<div class="intro">'+esc(g.intro)+'</div>'
        +'<ol>'+g.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'
        +'<div class="note">'+esc(g.note)+'</div>'
        +'<div class="ex"><b>言い方の例</b>'+esc(g.example)+'</div>'
        +'<button class="copy" id="cp">LINEで送る用にコピー</button>'
      +'</div>';
      $('#cp').addEventListener('click',function(){
        var b=this;
        navigator.clipboard.writeText(guideText(g)).then(function(){
          b.textContent='コピーしました';b.classList.add('done');
          setTimeout(function(){b.textContent='LINEで送る用にコピー';b.classList.remove('done')},1900);
        });
      });
    }

    /* 回ごとの記録（新しい順） */
    var rounds=(D.rounds||[]).slice().sort(function(a,b){return b.round-a.round});
    $('#rounds').innerHTML=rounds.map(function(r){
      var h='';

      if(r.note) h+='<div class="rnote">'+esc(r.note)+'</div>';

      h+=block('ok','確定した変更',
        (r.confirmed||[]).map(function(c){
          return '<div class="item"><div class="t">'+esc(c.title)+'</div>'
            +(c.detail?'<div class="d">'+esc(c.detail)+'</div>':'')+'</div>';
        }).join(''));

      h+=block('wip','いま決めようとしていること',
        (r.in_progress||[]).map(function(c){
          return '<div class="item"><div class="t">'+esc(c.title)+'<span class="badge wipb">未確定</span></div>'
            +(c.note?'<div class="d">'+esc(c.note)+'</div>':'')
            +(c.next?'<div class="next" style="color:var(--navy);border-left-color:var(--navy)">'+esc(c.next)+'</div>':'')
            +'</div>';
        }).join(''));

      h+=block('adj','調整中（スタッフには出さない）',
        (r.adjusting||[]).map(function(c){
          return '<div class="item"><div class="t">'+esc(c.title)+'<span class="badge ng">告知しない</span></div>'
            +(c.detail?'<div class="d">'+esc(c.detail)+'</div>':'')
            +(c.next?'<div class="next">'+esc(c.next)+'</div>':'')+'</div>';
        }).join(''));

      h+=block('todo','宿題・未整備',
        (r.todos||[]).map(function(c){
          return '<div class="item"><div class="t">'+esc(c.title)+'</div>'
            +(c.detail?'<div class="d">'+esc(c.detail)+'</div>':'')+'</div>';
        }).join(''));

      /* 検討中のルール案（status が確定でないもの）。スタッフ向けには出ない */
      if(r.round===D.meta.latest_round){
        var drafts=(D.rules||[]).filter(function(x){return x.status!=='確定'});
        h+=block('wip','検討中のルール案（スタッフ向けには出していない）',
          drafts.map(function(x){
            return '<div class="draft"><div class="t">'+esc(x.theme)+'<span class="badge wipb">'+esc(x.status)+'</span></div>'
              +(x.steps&&x.steps.length?'<ol>'+x.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')
              +((x.photos&&x.photos.length)
                  ? '<div class="pics">'+x.photos.map(function(p){
                      return '<div class="pic"><img src="'+photoSrc(r.date,p)+'" alt="'+esc(x.theme)+'" loading="lazy">'
                        +'<div class="cap">'+esc(x.theme)+'（現場の手書きメモ）</div></div>';
                    }).join('')+'</div>'
                  : '')
              +'</div>';
          }).join(''));
      }

      h+=block('hand','申し送り',
        (r.handoffs||[]).length?'<ul class="plain">'
          +r.handoffs.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'');

      h+=block('cand','改善候補（手書きメモより）',
        (r.candidates||[]).length?'<div class="chips">'
          +r.candidates.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>':'');

      h+=block('cand','その他の写真',
        (r.photos_other||[]).length?'<div class="pics">'
          +r.photos_other.map(function(p){
            return '<div class="pic"><img src="'+photoSrc(r.date,p.file)+'" alt="" loading="lazy">'
              +'<div class="cap">'+esc(p.caption)+'</div></div>';
          }).join('')+'</div>':'');

      if(r.source){
        h+=block('cand','元素材',
          '<div class="src">録音 '+esc(r.source.duration||'')+'　'+esc(r.source.recorded_at||'')+'<br>'
          +'<code>'+esc(r.source.audio)+'</code><br>'
          +'<code>'+esc(r.source.transcript)+'</code></div>');
      }

      return '<div class="round">'
        +'<div class="round-h"><span class="n">第'+r.round+'回</span>'
          +'<span class="d">'+fmt(r.date)+'</span>'
          +'<span class="rep">報告：'+(r.reporters||[]).join('・')+'</span></div>'
        +'<div class="round-b">'+h+'</div></div>';
    }).join('');

    $('#foot').innerHTML='この記録はメンバー用です。調整中の項目と宿題を含むため、スタッフには共有しません。'
      +'<br>スタッフ向けの確定ルールはこちら → <a href="'
      + (window.__STAFF_URL__ || 'index.html')
      + '" style="color:var(--navy);font-weight:700">接客ルール（スタッフ向け）を開く</a>'
      + '　※スタッフに配っているのと同じページです';
  }

  /* 写真タップで全体表示（手書きメモを読むため） */
  document.addEventListener('click',function(e){
    var img=e.target.closest('.pic img');
    if(!img) return;
    var z=document.createElement('div');
    z.className='zoom';
    z.innerHTML='<img src="'+img.getAttribute('src')+'" alt=""><div class="hint">タップで閉じる</div>';
    z.addEventListener('click',function(){z.remove();document.body.style.overflow=''});
    document.body.style.overflow='hidden';
    document.body.appendChild(z);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var z=document.querySelector('.zoom');
      if(z){z.remove();document.body.style.overflow=''}
    }
  });

  /* 公開用ビルドでは build_public.py が data URI を埋め込む。
     ローカルでは相対パスを使う。1つのHTMLで両方に対応するための分岐。 */
  function photoSrc(dir,file){
    if(window.__PHOTOS__ && window.__PHOTOS__[file]) return window.__PHOTOS__[file];
    return 'photos/'+dir+'/'+file;
  }

  if(window.__KAIZEN_DATA__){
    render(window.__KAIZEN_DATA__);
  } else {
    fetch('kaizen.json',{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(render)
      .catch(function(e){
        $('#sub').textContent='読み込みに失敗しました';
        $('#rounds').innerHTML='<div class="err">kaizen.json を読み込めませんでした（'+esc(e.message)+'）<br><br>'
          +'同じフォルダの <b>open.command</b> から開いてください。</div>';
      });
  }
})();
</script>
</body>
</html>
