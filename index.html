<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>接客ルール｜丸海屋 南三条店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf7f1;
  --paper-2:#fffdf9;
  --ink:#1f2328;
  --ink-2:#4a5158;
  --ink-3:#8a8f95;
  --navy:#1b3b58;
  --vermil:#b93f2b;
  --rule:#e4ddd0;
  --rule-2:#efe9dd;
  --gothic:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  --mincho:'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--gothic);font-size:16px;line-height:1.85;
  font-feature-settings:"palt" 1;
  padding:0 clamp(16px,4vw,28px) 80px;
}
.wrap{max-width:800px;margin:0 auto}

/* ── ヘッダー ── */
header{padding:clamp(30px,6vw,52px) 0 0}
.store{font-size:12px;letter-spacing:.2em;color:var(--ink-3)}
h1{
  font-family:var(--mincho);font-weight:600;
  font-size:clamp(32px,7vw,48px);line-height:1.2;letter-spacing:.06em;
  color:var(--navy);margin-top:8px;
}
.upd{margin-top:12px;font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.hr{height:2px;background:var(--navy);margin-top:22px;opacity:.9}

/* ── 今回変わったこと ── */
.news{
  margin-top:28px;background:var(--paper-2);
  border:1px solid var(--rule);border-left:4px solid var(--vermil);
  border-radius:3px;padding:20px 22px;
}
.news h2{
  font-size:12px;letter-spacing:.18em;color:var(--vermil);font-weight:700;margin-bottom:12px;
}
.news ul{list-style:none}
.news li{
  font-size:15.5px;font-weight:500;padding-left:20px;position:relative;line-height:1.75;
  margin-bottom:6px;
}
.news li:last-child{margin-bottom:0}
.news li::before{
  content:'';position:absolute;left:4px;top:.75em;
  width:6px;height:6px;background:var(--vermil);border-radius:50%;
}
.news .date{margin-top:12px;font-size:12px;color:var(--ink-3)}
/* 初回配信用のあいさつ。差分ではないので朱色ではなく紺で受ける */
.news.intro{border-left-color:var(--navy)}
.news.intro h2{color:var(--navy);font-size:13px}
.news.intro p{font-size:15px;line-height:1.85;color:var(--ink-2)}
.news.intro p+p{margin-top:9px}

/* ── ルールカード ── */
.card{
  margin-top:34px;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:4px;overflow:hidden;
}
.card-h{
  display:flex;align-items:baseline;gap:13px;
  padding:22px clamp(18px,4vw,26px) 0;
}
.num{
  font-family:var(--mincho);font-size:34px;line-height:1;
  color:var(--vermil);opacity:.85;flex-shrink:0;
}
.card-h h3{
  font-family:var(--mincho);font-weight:600;
  font-size:clamp(22px,4.6vw,27px);letter-spacing:.05em;line-height:1.35;color:var(--navy);
}
.card-b{padding:0 clamp(18px,4vw,26px) 24px}
.summary{
  margin-top:14px;font-size:17px;font-weight:500;line-height:1.75;
  padding:13px 16px;background:#f4efe4;border-radius:3px;
}
.steps{list-style:none;margin-top:18px;counter-reset:s}
.steps li{
  counter-increment:s;position:relative;padding:9px 0 9px 40px;
  font-size:15.5px;line-height:1.7;border-bottom:1px solid var(--rule-2);
}
.steps li:last-child{border-bottom:none}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:11px;
  width:25px;height:25px;border:1.5px solid var(--navy);color:var(--navy);
  border-radius:50%;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--gothic);
}
/* 場面ごとに分かれる手順 */
/* 上部タブ（接客ルール／ファースト） */
.toptabs{position:sticky;top:0;z-index:30;margin-top:16px;display:flex;gap:8px;
  background:var(--paper);padding:10px 0 12px}
.toptabs button{flex:1 1 0;font-family:inherit;font-size:14.5px;font-weight:700;line-height:1.3;
  color:var(--ink-2);background:var(--paper-2);border:1.5px solid var(--rule);border-radius:6px;
  padding:12px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.toptabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.toppanel[hidden]{display:none}

/* ファーストの手順（1ステップ＝1ブロック。ゆったり読ませる） */
.flow{margin-top:18px}
.fstep{position:relative;padding:0 0 0 34px;margin-top:26px}
.fstep:first-child{margin-top:14px}
.fstep .n{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.fstep .cue{font-size:12.5px;line-height:1.7;color:var(--ink-3);margin-bottom:7px}
.fstep .say{font-size:16px;line-height:2.05;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-left:4px solid var(--navy);border-radius:0 4px 4px 0;
  padding:14px 16px}
.fstep .act{margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--navy);font-weight:700}
.fstep .act::before{content:"→ ";color:var(--amber)}
.fstep .say.only{border-left-color:var(--amber)}

/* 添付（PDF等） */
.docs{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.docs a{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.5;
  color:var(--navy);text-decoration:none;font-weight:700;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:5px;padding:12px 14px}
.docs a::before{content:"PDF";flex:0 0 auto;font-size:10.5px;letter-spacing:.06em;
  background:var(--vermil);color:#fff;border-radius:3px;padding:3px 6px}
.docs a:active{background:#eef2f5}

/* 目次 */
.toc{margin-top:22px;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.toc h2{font-size:12px;letter-spacing:.12em;color:var(--navy);font-weight:700}
.toc ul{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px;list-style:none;padding:0}
.toc a{display:block;font-size:13px;line-height:1.4;color:var(--ink);text-decoration:none;
  background:#fff;border:1px solid var(--rule);border-radius:999px;padding:6px 12px}
.toc a:active{background:var(--navy);color:#fff}
/* タブ */
.tabbar{margin-top:18px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:6px;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;font-family:inherit;font-size:13.5px;font-weight:700;line-height:1.2;
  color:var(--ink-2);background:#fff;border:1.5px solid var(--rule);border-radius:999px;
  padding:9px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.tabbar button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tabpanel[hidden]{display:none}
.tabpanel>.sgroup.first{margin-top:16px}
.tabpanel>.sgroup.first+.sgroup{margin-top:24px}
.sgroup{margin-top:20px}
.sgroup+.sgroup{margin-top:24px;padding-top:20px;border-top:1px solid var(--rule-2)}
.sgroup-h{
  font-size:14px;font-weight:700;color:var(--navy);letter-spacing:.04em;
  padding-left:11px;border-left:3px solid var(--vermil);line-height:1.5;
}
.sgroup .steps{margin-top:12px}
.plainsteps{list-style:none;margin-top:12px}
.plainsteps li{
  font-size:15.5px;line-height:1.7;padding:9px 0 9px 22px;position:relative;
  border-bottom:1px solid var(--rule-2);
}
.plainsteps li:last-child{border-bottom:none}
.plainsteps li::before{
  content:'';position:absolute;left:5px;top:1.05em;
  width:6px;height:6px;background:var(--navy);border-radius:50%;
}

/* 保留中の項目など、グループへの注記 */
.sgroup-note{
  margin-top:12px;font-size:14px;line-height:1.75;color:var(--ink-2);
  background:#f2eee4;border:1px dashed #c4b79c;border-radius:3px;padding:11px 14px;
}

/* ルールの補足（例: 箸の本数） */
.rnotes{list-style:none;margin-top:16px}
.rnotes li{
  font-size:15.5px;font-weight:500;line-height:1.75;
  padding:12px 14px 12px 16px;background:#eef2f5;
  border-left:3px solid var(--navy);border-radius:0 3px 3px 0;
}
.rnotes li+li{margin-top:8px}

.items{list-style:none;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.items li{
  font-size:14.5px;background:#f1ece0;border:1px solid var(--rule);
  border-radius:3px;padding:6px 12px;
}
.why{
  margin-top:20px;padding:16px 18px;
  background:#f7f2e6;border:1px dashed #cbbfa6;border-radius:3px;
}
.why .lbl{
  display:block;font-size:11.5px;letter-spacing:.16em;color:var(--vermil);
  font-weight:700;margin-bottom:7px;
}
.why p{font-size:15px;line-height:1.8;color:var(--ink-2)}
.photos{margin-top:20px;display:grid;gap:12px}
.photos.two{grid-template-columns:1fr 1fr}
@media(max-width:520px){.photos.two{grid-template-columns:1fr}}
/* 縦長写真でページが伸びるのを防ぐ。contain なので手書きメモも切れない */
.photos img{
  width:100%;display:block;cursor:zoom-in;
  height:auto;max-height:420px;object-fit:contain;
  border:1px solid var(--rule);border-radius:3px;background:#f0eade;
}
@media(max-width:520px){.photos img{max-height:330px}}
.photos figure{margin:0}
.photos figcaption{
  margin-top:7px;font-size:12.5px;font-weight:700;color:var(--navy);
  letter-spacing:.06em;text-align:center;
}
.zoom{
  position:fixed;inset:0;z-index:100;background:rgba(28,24,18,.92);
  display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;
}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.zoom .hint{
  position:absolute;bottom:18px;left:0;right:0;text-align:center;
  font-size:12px;color:#cdc4b4;letter-spacing:.08em;
}
.since{margin-top:16px;font-size:12px;color:var(--ink-3);letter-spacing:.06em}

/* いま決めようとしていること（確定ではないので指示として出さない） */
.wip{
  margin-top:36px;padding:24px clamp(18px,4vw,26px);
  background:#f2eee4;border:1px dashed #c4b79c;border-radius:4px;
}
.wip h2{
  font-family:var(--mincho);font-size:21px;letter-spacing:.05em;
  color:var(--navy);font-weight:600;
}
.wip .lead{margin-top:8px;font-size:13.5px;color:var(--ink-2);line-height:1.8}
.wip ul{list-style:none;margin-top:16px}
.wip li{
  font-size:16px;font-weight:500;padding:11px 0 11px 22px;position:relative;
  border-bottom:1px solid #e0d7c4;line-height:1.7;
}
.wip li:last-child{border-bottom:none}
.wip li::before{
  content:'';position:absolute;left:3px;top:1.15em;
  width:8px;height:8px;border:2px solid var(--navy);border-radius:50%;
}
.wip .close{
  margin-top:16px;font-size:14px;font-weight:500;color:var(--navy);
  padding-left:13px;border-left:3px solid var(--navy);line-height:1.75;
}

/* 問い合わせ先 */
.ask{
  margin-top:36px;background:var(--paper-2);
  border:1px solid var(--rule);border-top:3px solid var(--navy);
  border-radius:3px;padding:22px clamp(18px,4vw,26px);
}
.ask h2{
  font-family:var(--mincho);font-size:19px;letter-spacing:.05em;
  color:var(--navy);font-weight:600;
}
.ask p{margin-top:9px;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.ask .who{
  margin-top:14px;font-size:16px;font-weight:500;line-height:1.8;color:var(--ink);
}
.ask .who .team{color:var(--navy);font-weight:700}
.ask .who .mem{font-size:15px;color:var(--ink-2)}
.ask .alt{margin-top:6px;font-size:15px;color:var(--ink-2)}

footer{
  margin-top:34px;padding-top:22px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--ink-3);line-height:1.9;
}
.err{
  margin-top:34px;padding:24px;background:#fff;border:1px solid var(--vermil);
  border-radius:3px;font-size:14px;line-height:1.9;
}

/* ── 印刷（バックヤード掲示用） ── */
@media print{
  body{background:#fff;font-size:11pt;padding:0}
  .wrap{max-width:100%}
  header{padding-top:0}
  h1{font-size:26pt}
  .card{break-inside:avoid;page-break-inside:avoid;margin-top:16pt;border-color:#999}
  .photos img{max-height:70mm;object-fit:cover}
  footer{color:#555}
}
</style>

<body>
<div class="wrap">

  <header>
    <div class="store" id="store">丸海屋 南三条店</div>
    <h1>接客ルール</h1>
    <div class="upd" id="upd">読み込み中…</div>
    <div class="hr"></div>
  </header>

  <div id="body"></div>

  <footer id="foot"></footer>
</div>

<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)};
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(d){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||''));
    return m ? m[1]+'年'+ +m[2] +'月'+ +m[3] +'日' : (d||'');
  }

  function render(D){
    var latest=(D.rounds||[]).slice().sort(function(a,b){return b.round-a.round})[0];
    $('#store').textContent=D.meta.store;
    $('#upd').textContent='最終更新 '+fmt(D.meta.updated_at);

    var html='';

    /* 初回配信のときは「今回変わったこと」を出さない。
       スタッフはまだ何も受け取っていないので、差分を見せても比較対象がない。
       とくに撤回（一度決めたが保留にした等）を書くと、見ていないものの取り消しになる。
       初回配信が終わったら meta.first_release を false にする。 */
    if(D.meta && D.meta.first_release){
      html+='<div class="news intro"><h2>はじめに</h2>'
        +'<p>このページに、いま守ってほしい接客ルールをまとめています。</p>'
        +'<p>ルールは実際にやってみて変わることがあります。'
        +'変わったときはこのページが更新され、上に「今回変わったこと」として出ます。</p>'
        +'<div class="date">'+fmt(D.meta.updated_at)+' 時点</div></div>';
    } else if(latest && latest.confirmed && latest.confirmed.length){
      html+='<div class="news"><h2>今回変わったこと</h2><ul>'
        + latest.confirmed.map(function(c){return '<li>'+esc(c.title)+'</li>'}).join('')
        + '</ul><div class="date">'+fmt(latest.date)+'　第'+latest.round+'回</div></div>';
    }

    var confirmed=(D.rules||[]).filter(function(r){return r.status==='確定'});
    /* ファーストは分量が大きく（他ルールの4〜5倍）、探している人と読む場面が違うので
       上部タブで別ページ扱いにする（2026-09-10）。ここでは2つに仕分けるだけ */
    var faRule=confirmed.filter(function(r){return r.id==='first-approach'})[0];
    var others=confirmed.filter(function(r){return r.id!=='first-approach'});

    var newsHtml=html; html='';

    /* 目次 ── ルールが20件を超えて上から探すのが現実的でなくなったため（2026-09-10） */
    if(others.length>=8){
      html+='<div class="toc"><h2>ルール一覧</h2><ul>'
        + others.map(function(r){
            return '<li><a href="#rule-'+esc(r.id)+'">'+esc(r.theme)+'</a></li>';
          }).join('')
        + '</ul></div>';
    }

    /* ルールカード（確定のみ） */
    function cardHtml(r,i){
      var html='';
      html+='<div class="card" id="rule-'+esc(r.id)+'">'
        +'<div class="card-h"><span class="num">'+(i+1)+'</span><h3>'+esc(r.theme)+'</h3></div>'
        +'<div class="card-b">';

      if(r.summary) html+='<div class="summary">'+esc(r.summary)+'</div>';

      /* step_groups … 場面ごとに手順が分かれるもの（例: 席のみ／ご予約）。
         ordered:true は番号付き、false は箇条書き。
         steps … 場面が分かれないもの（持ち物・点検項目）はタグ表示 */
      if(r.step_groups && r.step_groups.length){
        function sgroupHtml(g){
          var head=(g.label?'<div class="sgroup-h">'+esc(g.label)+'</div>':'');
          var note=(g.note?'<div class="sgroup-note">'+esc(g.note)+'</div>':'');
          /* flow … 状況・セリフ・次の動作に分かれた手順（ファーストのみ）。
             1ステップ1ブロックで行間を広く取る。現場は声に出して読むので詰めない */
          if(g.flow && g.flow.length){
            var body=g.flow.map(function(st,si){
              return '<div class="fstep"><span class="n">'+(si+1)+'</span>'
                +(st.cue?'<div class="cue">'+esc(st.cue)+'</div>':'')
                +'<div class="say'+(st.cue?'':' only')+'">'+esc(st.say)+'</div>'
                +(st.act?'<div class="act">'+esc(st.act)+'</div>':'')
                +'</div>';
            }).join('');
            return head+'<div class="flow">'+body+'</div>'+note;
          }
          var li=(g.steps||[]).map(function(s){return '<li>'+esc(s)+'</li>'}).join('');
          return head
            +(g.ordered ? '<ol class="steps">'+li+'</ol>' : '<ul class="plainsteps">'+li+'</ul>')
            +note;
        }
        /* tab を持つグループはタブで1つずつ表示する（例: ファーストの5パターン）。
           スタッフは目の前のお客様に当てはまる1つしか見ないので、全部並べない。
           tab の無いグループは、これまで通りタブの下に並べる */
        /* 同じ tab 名のグループは1枚のパネルにまとめる
           （締め作業マニュアルのように、1タブの中が時間帯で分かれるもの） */
        var names=[], byTab={};
        r.step_groups.forEach(function(g){
          if(!g.tab) return;
          if(!byTab[g.tab]){ byTab[g.tab]=[]; names.push(g.tab); }
          byTab[g.tab].push(g);
        });
        var plain = r.step_groups.filter(function(g){return !g.tab});
        if(names.length > 1){
          html += '<div class="tabbar" role="tablist" data-rule="'+esc(r.id)+'">'
            + names.map(function(nm,ti){
                return '<button role="tab" aria-selected="'+(ti===0)+'" data-t="'+ti+'">'+esc(nm)+'</button>';
              }).join('')
            + '</div>'
            + names.map(function(nm,ti){
                var inner = byTab[nm].map(function(g,gi){
                  return '<div class="sgroup'+(gi===0?' first':'')+'">'+sgroupHtml(g)+'</div>';
                }).join('');
                return '<div class="tabpanel" data-rule="'+esc(r.id)+'" data-t="'+ti+'"'
                  + (ti===0?'':' hidden') + '>' + inner + '</div>';
              }).join('');
        } else {
          plain = r.step_groups;
        }
        html += plain.map(function(g){return '<div class="sgroup">'+sgroupHtml(g)+'</div>'}).join('');
      } else if(r.steps && r.steps.length){
        html += '<ul class="items">'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>';
      }

      /* notes … ルールに対する補足（例: 箸の本数）。タグや手順に収まらない条件を書く */
      if(r.notes && r.notes.length){
        html += '<ul class="rnotes">'+r.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul>';
      }

      /* なぜ ── 空のときは欄そのものを出さない（推測で埋めない） */
      if(r.why && r.why.trim()){
        html+='<div class="why"><span class="lbl">なぜ</span><p>'+esc(r.why)+'</p></div>';
      }

      /* photos は文字列（"日付/ファイル名"）でも {file, caption} でもよい。
         キャプションは整理前／整理後のように写真の意味が違うときに使う */
      if(r.photos && r.photos.length){
        html+='<div class="photos'+(r.photos.length>1?' two':'')+'">'
          + r.photos.map(function(p){
              var file = (typeof p==='string') ? p : p.file;
              var cap  = (typeof p==='string') ? '' : (p.caption||'');
              return '<figure><img src="'+photoSrc(file)+'" alt="'+esc(cap||r.theme)+'" loading="lazy">'
                + (cap?'<figcaption>'+esc(cap)+'</figcaption>':'') + '</figure>';
            }).join('')
          + '</div>';
      }

      /* docs … 印刷して使う原本（PDF）。ページで読めるようにした上で、原本も置く */
      if(r.docs && r.docs.length){
        html+='<div class="docs">'
          + r.docs.map(function(x){
              var file=(typeof x==='string')?x:x.file;
              var lbl =(typeof x==='string')?file:(x.label||file);
              return '<a href="docs/'+esc(file)+'" target="_blank" rel="noopener">'+esc(lbl)+'</a>';
            }).join('')
          + '</div>';
      }

      html+='<div class="since">'+fmt(r.since)+' から</div>';
      html+='</div></div>';
      return html;
    }

    others.forEach(function(r,i){ html+=cardHtml(r,i); });

    /* いま決めようとしていること ── 確定ではないので指示ではなく「お知らせ」として出す */
    if(latest && latest.in_progress && latest.in_progress.length){
      html+='<div class="wip"><h2>いま決めようとしていること</h2>'
        +'<div class="lead">まだ決まっていないので、今のやり方のままで大丈夫です。</div><ul>'
        + latest.in_progress.map(function(w){return '<li>'+esc(w.title)+'</li>'}).join('')
        + '</ul><div class="close">決まり次第、このページでお知らせします。</div></div>';
    }

    /* 問い合わせ先 */
    var c=(D.meta||{}).contact;
    if(c){
      html+='<div class="ask"><h2>質問・気づいたことがあれば</h2>'
        +'<p>やりにくいこと、分からないこと、「こうした方がいいのでは」と思ったことがあれば、'
        +'どれでも遠慮なく声をかけてください。</p>'
        +'<div class="who"><span class="team">'+esc(c.team)+'</span>'
        +(c.members&&c.members.length?'　<span class="mem">'+esc(c.members.join('・'))+'</span>':'')
        +'</div>'
        +(c.alt?'<div class="alt">もしくは '+esc(c.alt)+' まで</div>':'')
        +'</div>';
    }

    /* 上部タブで2枚に分ける。ファーストが無ければ従来どおり1枚のまま */
    var out;
    if(faRule){
      out = '<div class="toptabs" role="tablist">'
          + '<button role="tab" aria-selected="true" data-p="0">接客ルール</button>'
          + '<button role="tab" aria-selected="false" data-p="1">ファースト</button>'
          + '</div>'
          + '<div class="toppanel" data-p="0">' + newsHtml + html + '</div>'
          + '<div class="toppanel" data-p="1" hidden>' + cardHtml(faRule, 0) + '</div>';
    } else {
      out = newsHtml + html;
    }

    $('#body').innerHTML=out;
    $('#foot').innerHTML='ルールは実際にやってみて変わることがあります。'
      +'変わったときはこのページが更新されます。';
  }

  /* 上部タブ（接客ルール／ファースト） */
  document.addEventListener('click',function(e){
    var b=e.target.closest('.toptabs button');
    if(!b) return;
    var pi=b.getAttribute('data-p');
    b.parentNode.querySelectorAll('button').forEach(function(x){
      x.setAttribute('aria-selected', String(x===b));
    });
    document.querySelectorAll('.toppanel').forEach(function(pnl){
      pnl.hidden = (pnl.getAttribute('data-p')!==pi);
    });
    window.scrollTo(0,0);
  });

  /* タブ切り替え ── 同じルール内のパネルだけを差し替える */
  document.addEventListener('click',function(e){
    var b=e.target.closest('.tabbar button');
    if(!b) return;
    var bar=b.closest('.tabbar'), rid=bar.getAttribute('data-rule'), t=b.getAttribute('data-t');
    bar.querySelectorAll('button').forEach(function(x){
      x.setAttribute('aria-selected', String(x===b));
    });
    document.querySelectorAll('.tabpanel[data-rule="'+rid+'"]').forEach(function(pnl){
      pnl.hidden = (pnl.getAttribute('data-t')!==t);
    });
  });

  /* 写真タップで全体表示 */
  document.addEventListener('click',function(e){
    var img=e.target.closest('.photos img');
    if(img){
      var z=document.createElement('div');
      z.className='zoom';
      z.innerHTML='<img src="'+img.getAttribute('src')+'" alt=""><div class="hint">タップで閉じる</div>';
      z.addEventListener('click',function(){z.remove();document.body.style.overflow=''});
      document.body.style.overflow='hidden';
      document.body.appendChild(z);
      return;
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var z=document.querySelector('.zoom');
      if(z){z.remove();document.body.style.overflow=''}
    }
  });

  /* 写真は photos/ からの相対パスで持つ（例 "2026-08-04/6981.jpeg"）。
     回ごとにフォルダが増えるため、最新回の日付から組み立てると過去回の写真が消える。
     公開用ビルドでは build_public.py が window.__PHOTOS__ に data URI を埋め込む。 */
  function photoSrc(file){
    if(window.__PHOTOS__ && window.__PHOTOS__[file]) return window.__PHOTOS__[file];
    return 'photos/'+file;
  }

  /* 同じく、公開用ビルドでは window.__KAIZEN_DATA__ にJSONが埋め込まれる */
  if(window.__KAIZEN_DATA__){
    render(window.__KAIZEN_DATA__);
  } else {
    fetch('kaizen.json',{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(render)
      .catch(function(e){
        $('#upd').textContent='読み込みに失敗しました';
        $('#body').innerHTML='<div class="err">kaizen.json を読み込めませんでした（'+esc(e.message)+'）<br><br>'
          +'このファイルを直接ダブルクリックした場合はこの表示になります。同じフォルダの <b>open.command</b> から開いてください。</div>';
      });
  }
})();
</script>
</body>
</html>
